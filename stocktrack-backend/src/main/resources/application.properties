# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/stocktrack_db
spring.datasource.username=db_user
spring.datasource.password=db_user
spring.datasource.driver-class-name=org.postgresql.Driver

postgres.bin.path=C:/Program Files/PostgreSQL/16/bin
postgres.host=localhost
postgres.port=5432

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging
logging.level.org.springframework=WARN
logging.level.com.stocktrack.backend=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Allow connections from other devices on the network
server.address=0.0.0.0

# JWT Configuration
stocktrack.app.jwtSecret=YourSuperSecretKeyWithAtLeast32CharactersLong!
stocktrack.app.jwtExpirationMs=86400000

# Backup directory (relative to app root)
backup.directory=backups